name: Automatic Daily Analysis

on:
  workflow_dispatch:
  schedule:
    - cron: "27 18 * * 1-5"
      timezone: "Asia/Tokyo"
    - cron: "37 8 * * 1-5"
      timezone: "Asia/Tokyo"

permissions:
  contents: write

concurrency:
  group: stockman-daily-analysis
  cancel-in-progress: false

jobs:
  daily-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test deterministic engine
        run: node --test tests/analysis-core.test.js
      - name: Generate current research snapshot
        env:
          STOCKMAN_PUBLIC_FEED_URL: ${{ vars.STOCKMAN_PUBLIC_FEED_URL }}
          STOCKMAN_PUBLIC_FEED_TOKEN: ${{ secrets.STOCKMAN_PUBLIC_FEED_TOKEN }}
        run: node scripts/run-daily-analysis.js
      - name: Commit non-confidential result
        run: |
          git config user.name "stockman-analysis-bot"
          git config user.email "stockman-analysis-bot@users.noreply.github.com"
          git add data/daily-analysis.json data/history/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh automatic daily analysis [skip ci]"
            git push
          fi
